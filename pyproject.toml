[project]
name = "tabletop"
version = "0.2.0"
description = "Reformat, sort, filter, and reshape space-aligned CLI table output"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=15.0.0",
]

[project.scripts]
tabletop = "tabletop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tabletop"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.17",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (catches unused imports, undefined names)
    "I",   # isort (import ordering)
    "N",   # naming conventions
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade (modernize for target version)
]
ignore = [
    "E501",  # line-too-long — handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803", "N806"]  # allow test function names like test_parse_basic
